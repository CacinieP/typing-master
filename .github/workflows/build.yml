name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate word data, templates & unit tests
        run: |
          node scripts/validate_words.js
          node scripts/test_units.js
          # 模板单源校验：重新生成 templates/*.csv，有任何漂移即失败（issue #6）
          node scripts/gen_templates.js
          git diff --exit-code -- templates/

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: npm run build:win

      - name: Configure macOS signing env
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        # 仅当证书 secret 非空时才导出 CSC_* 变量。
        # CSC_LINK 支持直接传 base64 证书内容：electron-builder 的 importCertificate()
        # 会自行解码、创建临时 keychain 并导入签名（无需手工 security import 步骤）。
        # （原 "Prepare macOS signing certificate" 步骤因 if 中引用同 step 的 env
        #   条件恒为 false 从未执行过，已删除。）
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "::notice::macOS 签名已启用(证书已配置)"
          else
            echo "::notice::macOS 签名已跳过(未配置 MACOS_CERTIFICATE secret)"
          fi

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac' && github.event_name != 'pull_request'
        run: npm run build:mac
        env:
          # 公证凭证注入 afterSign 钩子（build/notarize.js，唯一公证入口；
          # electron-builder 内置公证已由 mac.notarize=false 关闭，避免双重公证）。
          # 任一缺失则只签名不公证（notarize.js 内部判断）。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple DMGs
        if: matrix.platform == 'mac' && github.event_name != 'pull_request'
        # app 内的 staple 由 @electron/notarize 自动完成（afterSign）。
        # DMG 是公证之后才打包的文件，Apple 服务器没有它的提交记录，
        # stapler 直接 staple 会 "Record not found" —— 必须先用 notarytool
        # 提交 DMG 本身公证，再 stapler 补票据（issue #9）。
        # 凭证缺失时跳过，不阻塞构建。
        run: |
          shopt -s nullglob
          for f in dist/*.dmg; do
            if xcrun notarytool submit "$f" \
                 --apple-id "$APPLE_ID" \
                 --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                 --team-id "$APPLE_TEAM_ID" \
                 --wait; then
              xcrun stapler staple "$f"
              xcrun stapler validate "$f"
              echo "::notice::notarized + stapled $f"
            else
              echo "::warning::DMG 公证跳过（$f —— 凭证缺失或提交失败）"
            fi
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typing-master-${{ matrix.platform }}
          path: dist/**/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/typing-master-win/*.exe
            artifacts/typing-master-mac/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
