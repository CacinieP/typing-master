<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="100%" style="stop-color:#bb9af7"/>
    </linearGradient>
    <linearGradient id="keyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b4261"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Keyboard outline -->
  <rect x="56" y="180" width="400" height="200" rx="16" ry="16" fill="url(#keyBg)" stroke="#545c7e" stroke-width="2" filter="url(#shadow)"/>
  <!-- Row 1: number keys -->
  <rect x="76" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="112" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="148" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="184" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="220" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="256" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="292" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="328" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="364" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="400" y="196" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <!-- Row 2: QWERTY -->
  <rect x="84" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="120" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="156" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="192" y="232" width="28" height="28" rx="4" fill="#bb9af7" stroke="#bb9af7" stroke-width="2" filter="url(#glow)"/>
  <rect x="228" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="264" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="300" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="336" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="372" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="408" y="232" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <!-- Row 3: ASDF -->
  <rect x="96" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="132" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="168" y="268" width="28" height="28" rx="4" fill="#9ece6a" stroke="#9ece6a" stroke-width="2" filter="url(#glow)"/>
  <rect x="204" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="240" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="276" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="312" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="348" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="384" y="268" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <!-- Row 4: ZXCV -->
  <rect x="112" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="148" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="184" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="220" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="256" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="292" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="328" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <rect x="364" y="304" width="28" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <!-- Space bar -->
  <rect x="168" y="340" width="176" height="28" rx="4" fill="#3b4261" stroke="#545c7e" stroke-width="1"/>
  <!-- Title text "T" with typing cursor effect -->
  <text x="256" y="140" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="100" font-weight="800" fill="#c0caf5">T</text>
  <text x="256" y="140" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="100" font-weight="800" fill="url(#bg)" opacity="0.9">T</text>
  <!-- Cursor blink line -->
  <rect x="218" y="95" width="4" height="60" rx="2" fill="#9ece6a" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Speed lines under the cursor key -->
  <line x1="280" y1="104" x2="310" y2="104" stroke="#7aa2f7" stroke-width="2" opacity="0.6">
    <animate attributeName="x2" values="310;330;310" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="280" y1="114" x2="300" y2="114" stroke="#bb9af7" stroke-width="2" opacity="0.5">
    <animate attributeName="x2" values="300;320;300" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="280" y1="124" x2="290" y2="124" stroke="#7aa2f7" stroke-width="2" opacity="0.4">
    <animate attributeName="x2" values="290;310;290" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <!-- Globe/language icon hint at bottom -->
  <circle cx="256" cy="440" r="16" fill="none" stroke="#545c7e" stroke-width="1.5"/>
  <ellipse cx="256" cy="440" rx="8" ry="16" fill="none" stroke="#545c7e" stroke-width="1"/>
  <line x1="240" y1="440" x2="272" y2="440" stroke="#545c7e" stroke-width="1"/>
  <!-- Language text -->
  <text x="256" y="476" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#545c7e" letter-spacing="2">FR ES IT PT RU JA</text>
</svg>
